spring:
  application:
    name: domino
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      connect-timeout: 1s
      timeout: 1s

firebase:
  project-id: ${FIREBASE_PROJECT_ID:teamfho-domino}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      group:
        realtime:
          include: redis

realtime:
  auth-timeout-seconds: 5
  heartbeat-interval-seconds: 20
  heartbeat-timeout-seconds: 45
  presence-ttl-seconds: 60
  messages-per-second: 10

domino:
  monetization:
    policy:
      cache-seconds: ${DOMINO_MONETIZATION_POLICY_CACHE_SECONDS:60}
    version: ${DOMINO_MONETIZATION_VERSION:1}
    ads-enabled: ${DOMINO_MONETIZATION_ADS_ENABLED:true}
    rewarded:
      enabled: ${DOMINO_MONETIZATION_REWARDED_ENABLED:true}
      coins: ${DOMINO_MONETIZATION_REWARD_COINS:10}
      max-per-round: ${DOMINO_MONETIZATION_MAX_PER_ROUND:1}
      cooldown-seconds: ${DOMINO_MONETIZATION_COOLDOWN_SECONDS:120}
      max-per-hour: ${DOMINO_MONETIZATION_MAX_PER_HOUR:5}
      max-per-day: ${DOMINO_MONETIZATION_MAX_PER_DAY:20}
      max-coins-per-day: ${DOMINO_MONETIZATION_MAX_COINS_PER_DAY:200}
